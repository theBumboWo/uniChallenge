[package]
name = "whimsical-agent-village"
version = "0.1.0"
description = "Whimsical Agent Village — cozy fantasy AI agent workspace"
authors = ["Whimsical Agent Village Contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "whimsical_agent_village_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }

# Keyring for Windows Credential Manager (Req 13)
keyring = "3"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# Logging — credentials are NEVER logged (Req 13.3)
log = "0.4"
env_logger = "0.11"

[features]
# This feature is used for production builds or when `devPath` points to the filesystem.
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
